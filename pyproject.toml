[project]
name = "t2s"
version = "0.1.0"
description = "Text-to-SQL analytics agent with rigorous evaluation (Olist e-commerce)"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1", "sqlglot>=25", "pandas", "numpy", "plotly", "pyyaml",
  "pydantic>=2", "pydantic-settings", "tenacity", "diskcache", "requests",
  "fastapi", "uvicorn", "streamlit", "slowapi", "openpyxl", "python-multipart",
]
[project.optional-dependencies]
dev = ["pytest", "httpx"]
embed = ["sentence-transformers"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
